# ERP Agent 系统配置文件
# 敏感信息（API Key 等）通过环境变量注入，不在此文件中存储

app:
  name: "ERP Analysis Agent"
  version: "0.1.0"
  debug: false
  language: "zh"  # 报告语言：zh=中文
  timezone: "Asia/Shanghai"  # 业务时区：全链路(代码/DB/checkpointer)统一使用；改动需重启进程
  tiktoken_warmup_enabled: true  # 启动时预热 tiktoken 编码，避免首次请求因下载 BPE 文件卡顿

llm:
  provider: "qwen"          # 模型提供商：zhipu / openai / deepseek / qwen
  model: "qwen3-max"             # 默认模型
  # api_base: "https://open.bigmodel.cn/api/paas/v4"  # API Base URL
  api_base: "https://dashscope.aliyuncs.com/compatible-mode/v1"
  # api_key: 通过环境变量 LLM_API_KEY 注入
  temperature: 0.1
  max_tokens: 4096
  timeout: 240               # 请求超时（秒）；单次 LLM 最大耗时 240s
  max_retries: 2             # 最大重试次数；最坏 240s×3=720s
  use_system_proxy: false    # 是否读取系统代理（HTTP_PROXY/HTTPS_PROXY）；false=强制直连
  context_window: 32768      # 模型上下文窗口大小（token 数）
  token_estimate_ratio: 1.5  # 字符数 / token 数估算比率（中文约 1.5）

# 小模型配置（报告生成 / L3 意图分类等轻量任务）。
# 与 llm 字段集完全对称；未显式配置的字段会在启动期自动从 llm 镜像过来，
# 因此测试环境可整块省略，生产按需覆盖。
# env 前缀为 LLM_FAST_，敏感字段走 LLM_FAST_API_KEY / LLM_FAST_API_KEY_ENCRYPTED。
llm_fast:
  # provider: "qwen"
  # model: "qwen-flash"                # 生产建议用更小/更快的模型
  # api_base: "https://dashscope.aliyuncs.com/compatible-mode/v1"
  # api_key: 通过环境变量 LLM_FAST_API_KEY 注入
  # temperature: 0.1
  # max_tokens: 4096
  # timeout: 60                        # 小模型延迟期望更低，可设更短超时
  # max_retries: 2
  # use_system_proxy: false
  # context_window: 32768
  # token_estimate_ratio: 1.5

neo4j:
  enabled: false              # 总开关：false 时服务不依赖 Neo4j，相关功能短路
  uri: "bolt://localhost:7687"
  username: "neo4j"
  # password: 通过环境变量 NEO4J_PASSWORD 注入
  database: "neo4j"
  max_connection_pool_size: 10

graphiti_etl:
  enabled: true
  query_backend: "graphiti"             # graphiti / postgresql / hybrid
  sync_interval_seconds: 600
  full_sync_on_startup: true
  batch_size: 500
  max_concurrent_domains: 3
  sync_timeout_seconds: 3600
  incremental_timeout_seconds: 300
  retry_max_attempts: 3
  retry_backoff_seconds: 5.0
  llm_extraction_enabled: false
  llm_extraction_batch_size: 20
  search_default_top_k: 10
  search_timeout_seconds: 30
  context_enrichment_enabled: true
  episode_batch_size: 50                 # rows merged into one Graphiti episode
  max_load_concurrency: 3               # concurrent episode writes (lower = fewer Neo4j tx conflicts)
  max_rows_per_table: 20                # per-table row cap (0=unlimited, >0 for testing/validation)
  max_nodes_per_sync: 50000
  max_edges_per_sync: 100000

chroma:
  persist_directory: "./data/chroma"
  collection_name: "erp_ontology"      # 兼容字段（旧版默认 collection）
  embedding_provider: "default"        # default | fake | openai | dashscope | zhipu
  embedding_model: "text-embedding-3-small"
  embedding_api_base: ""               # 远端 provider 的 API Base
  # embedding_api_key: 通过环境变量 CHROMA_EMBEDDING_API_KEY 注入
  default_top_k: 5
  min_score: 0.0
  enable_long_term_indexing: false   # 长期记忆写入时同步索引到向量库
  enable_report_indexing: false      # 报告写入时同步索引到向量库
  # 多 collection 划分：业务键 → 实际 collection 名称
  collections:
    ontology_p2p: "ontology_p2p"
    business_docs_p2p: "business_docs_p2p"
    analysis_reports: "analysis_reports"
    memory_long_term: "memory_long_term"

postgresql:
  host: "localhost"
  port: 5432
  database: "eragent"
  username: "dev"
  # password: 通过环境变量 POSTGRES_PASSWORD 注入
  pool_size: 20
  max_overflow: 30

mock_data:
  record_count: 20               # 模拟数据生成条数（PO/发票/付款各 N 条）
  seed: 42                       # 随机种子，确保数据可重复

analysis:
  default_time_range_days: 30    # 默认分析时间范围（天）
  max_time_range_days: 365       # 单次查询最大时间范围（天）
  response_timeout_seconds: 900.0  # 整体超时；需覆盖 LLM 含重试(720s) + 编排开销
  db_io_timeout_seconds: 30.0    # 数据库 I/O 单次操作硬超时（秒）

  # 实体编号正则模式（按客户 EBS 编号规则配置）
  # 每个实体支持多个正则模式（按顺序尝试，首个匹配即返回）
  entity_patterns:
    po_number:
      - 'PO-\d[\da-zA-Z_-]*\d'     # PO-2024-0001
      - 'PO-\d+'                     # PO-001
    vendor_id:
      - 'SUP-\d+'                    # SUP-001
    invoice_num:
      - 'INV-\d[\da-zA-Z_-]*\d'     # INV-2024-0001
      - 'INV-\d+'                    # INV-001
    check_number:
      - 'PAY-\d[\da-zA-Z_-]*\d'     # PAY-2024-0001
      - 'PAY-\d+'                    # PAY-001
    receipt_number:
      - 'RCV-\d[\da-zA-Z_-]*\d'     # RCV-2024-0001
      - 'RCV-\d+'                    # RCV-001
      - 'GR-\d+'                     # GR-0001 (goods receipt)
    days:
      - '(?:最近|过去|近)\s*(\d+)\s*天'
      - '(?:past|last|recent)\s+(\d+)\s*days?'

agent_runtime:
  max_short_term_sessions: 1024       # 进程内最大并发 session 数（LRU 淘汰）
  retry_backoff_base_seconds: 1.0     # 重试退避基数（秒），实际等待 base * 2^attempt
  retry_backoff_max_seconds: 30.0     # 退避上限（秒）

observability:
  max_io_text: 2000                   # trace 中 input/output 文本截断长度
  max_error_text: 8192                # trace 中 error 字段（含异常链）最大字符数
  trace_queue_maxsize: 10000          # trace 异步写入队列上限
  trace_batch_size: 50                # 批量写入条数
  trace_flush_interval: 1.0           # 批量写入间隔（秒）
  console_enabled: true               # 控制台是否打印 trace 树 + 汇总
  console_stream: "stdout"            # trace 专用输出流 (stdout|stderr)，与业务日志分流
  console_io_panel: false             # 每次 model/tool 调用的 I/O 面板；生产默认关，排查时开启
  slow_tool_ms: 2000                  # 超过此耗时的 tool 调用打 WARNING
  slow_model_ms: 5000                 # 超过此耗时的 model 调用打 WARNING
  verbose_calls: true                 # 高频调用 INFO 开关（LLM/Tool/Memory/checkpointer）；高并发场景可关闭降噪
  log_llm_content: true               # verbose_calls INFO / 异常 WARNING 是否附带 prompt/response/args/output 预览
  log_content_truncate: 500           # 上述内容预览截断字符数
  log_on_error_only: false            # true=正常路径只留摘要，内容仅在异常 WARNING 中输出（生产合规模式）

async_analysis:
  max_concurrent_tasks: 5             # 同进程并发分析任务上限，超出 queued 排队
  result_cache_ttl_sec: 600           # 任务完成后内存中 result 快照保留时间
  sweep_interval_sec: 60              # 清理过期 entry 的扫描周期
  event_buffer_size: 200              # 每 trace_id 的 SSE 事件环形缓冲条数
  sse_heartbeat_sec: 15               # SSE 心跳周期（秒），防代理 idle 超时
  runner_hard_timeout_seconds: 600.0  # runner_factory 协程硬超时，防止 entry.state 卡 RUNNING
  runner_stall_grace_seconds: 60.0    # sweep 纠偏僵尸 RUNNING entry 的宽限窗口
  trace_flush_barrier_timeout: 10.0   # publish_done 前等 trace_runs commit 的秒数
  orphan_pending_chat_max_age_sec: 1800  # sweep 纠偏超龄 pending chat_messages 的阈值

  # SSE 事件总线后端。
  # - memory：进程内 asyncio.Queue，仅适用于 workers=1 的单进程部署
  # - redis：Redis Pub/Sub + 环形缓冲，支持 uvicorn --workers>1 多进程共享事件
  # 多 worker 部署必须使用 redis，否则 POST 落到 worker A 的任务事件无法
  # 送达订阅落在 worker B 的 SSE 连接，前端只能看到心跳（详见 docs/issue/async_analyze_backend_issue.md）
  event_backend: "memory"
  redis_url: "redis://localhost:6379/0"  # 仅 event_backend=redis 时需要
  redis_key_prefix: "eragent:events"     # Redis key 前缀，多实例隔离用

p2p:
  three_way_match:
    default_tolerance_pct: 5.0   # 三路匹配默认容差（%）
    max_tolerance_pct: 10.0      # 最大容差上限（%）
    # 按供应商配置容差（示例）
    supplier_tolerances: {}
    # 按物料类别配置容差（示例）
    category_tolerances:
      RAW_MATERIAL: 10.0         # 大宗原材料放宽至10%
    # 按金额区间配置容差（示例）
    amount_thresholds:
      - min_amount: 1000000      # 金额超过100万收紧
        tolerance_pct: 2.0

  payment_compliance:
    early_payment_threshold_days: 5   # 提前超过N天预警
    overdue_severity:
      low_days: 7                     # 逾期<7天：LOW
      medium_days: 30                 # 逾期7-30天：MEDIUM
      high_days: 30                   # 逾期>30天：HIGH

  supplier_performance:
    benchmarks:
      otif_rate: 95.0                 # OTIF 基准值（%）
      invoice_accuracy_rate: 99.0     # 发票准确率基准值（%）
      quality_pass_rate: 98.0         # 质量合格率基准值（%）
      price_compliance_rate: 98.0     # 价格执行率基准值（%）

  anomaly_severity:
    high_amount_threshold: 500000     # 金额超过50万自动升为HIGH
    variance_high_multiplier: 2.0     # 超容差2倍以上为HIGH

  # tool 返回值裁剪：源头防止 ERP 大数据量压垮 ReAct 消息历史或 ReportAgent prompt。
  # 超过 max_items 的列表只保留前 N 条，尾部追加一条 "_truncated" 摘要记录；
  # 最终 JSON 再受 max_chars 兜底（超过则从列表尾部继续丢弃到达标）。
  tool_output:
    max_items: 200                    # 列表型返回最多保留的条目数（0 关闭）
    max_chars: 30000                  # 单次 tool 返回 JSON 字符数硬上限（0 关闭）

report:
  # ReportAgent LLM 输出硬上限（token）；覆盖 llm_fast.max_tokens。
  # 0 表示不覆盖，沿用 llm_fast.max_tokens 的值。
  # 经验值：硬上限需预留软上限 2~3 倍余量，应对小模型前置 reasoning 吐字
  # 与英文展开导致的 token 膨胀，避免触顶截断。
  max_output_tokens: 3000
  # 各 output_mode 对应的软性字数引导，注入到 ReportAgent prompt 中。
  # 软上限按中文字数给，硬上限按 token 给；两者需留出安全比，不要贴得太近。
  detailed_max_chars: 800             # detailed：保持 4 段结构但限定总字数
  brief_max_chars: 500                # brief：简报摘要模式
  table_max_chars: 300                # table：表格 + 简短结论
  chat_max_chars: 200                 # chat：自然对话（事实查询场景，自动按 intent_kind 选用）
  # 单个 tool 输出拼入报告 prompt 时的字符硬上限；仅 span attr 记录截断计数，
  # 不把"已截断"标记写入 prompt，避免引导模型在报告里反复强调数据不全。
  outputs_per_key_max_chars: 12000
  # tool outputs 整体 token 预算占 llm_fast.context_window 的百分比（0 关闭预算制）。
  # 生效顺序：总预算均摊到各 key → 再受 outputs_per_key_max_chars 上限约束。
  outputs_context_max_tokens_pct: 60
  # 模板常量 token 预留（prompt 骨架 + 规则 + 本体等），从总预算中扣除。
  outputs_template_overhead_tokens: 1500

memory:
  short_term:
    max_messages: 20            # 滑动窗口最大消息数
    summary_threshold: 15       # 超过N条消息触发摘要压缩
    context_trim_enabled: true  # 注入 LLM 前的 token 裁剪兜底开关
    context_max_tokens_pct: 15  # 短期记忆最大占 context_window 的百分比
    summary_enabled: true       # LLM 异步摘要总开关
    summary_max_input_chars: 5000   # 超过此长度才触发摘要
    summary_max_output_tokens: 500  # 摘要输出 token 上限
    summary_timeout_seconds: 30     # LLM 摘要调用超时
  long_term:
    enabled: true               # 长期记忆主路径总开关（SQL 读写）
    max_retrieved: 5            # Hybrid 检索最多返回N条历史记忆
    context_trim_enabled: true  # 注入 LLM 前的 token 裁剪兜底开关
    context_max_tokens_pct: 12  # 长期记忆最大占 context_window 的百分比
    fusion_k: 60                # RRF 融合的平滑常数
    max_per_user: 200           # 每个用户保留的最大记忆条数（0 表示不限制）
    min_content_len: 50         # 短于该长度的内容直接 skip（0 关闭）
    dedupe_window_seconds: 900  # 同 user + 同 content_hash 的去重时间窗口（0 关闭）
    skip_empty_conclusions: false  # 跳过 anomaly_count=0 且 summary 空的结论
    search_timeout_seconds: 0.2 # 检索注入整体超时（秒），超时返回空记忆
    type_budget_pct:            # 各类型 token 子预算（占 long_term 总预算百分比）
      entity_profile: 40
      user_preference: 20
      analysis_insight: 15
      correction: 15
      domain_fact: 10
    type_max_retrieved:         # 各类型检索最大条数
      entity_profile: 3
      user_preference: 2
      analysis_insight: 2
      correction: 2
      domain_fact: 3
  react:
    trim_enabled: true              # ReAct 循环内 LLM 输入裁剪总开关
    keep_recent_rounds: 2           # 保留最近几轮完整对话（含工具结果）
    tool_content_max_chars: 500     # 早期 ToolMessage 截断字符数（0=清空内容）
  ttl:                              # 各类型 TTL（天数，0=不过期）
    entity_profile_days: 90
    analysis_insight_days: 60
    correction_days: 180
    user_preference_days: 0
    domain_fact_days: 0
  consolidation:                    # 记忆整合配置
    enabled: true                   # 整合总开关
    min_new_memories: 20            # 触发条件：新增记忆数阈值
    max_interval_hours: 72          # 触发条件：最大时间间隔（小时）
    lock_timeout_seconds: 600       # 整合锁超时（秒）
    llm_enabled: true               # LLM 语义合并开关
    llm_timeout_seconds: 60         # 单次 LLM 调用超时
  feedback:                         # 用户反馈检测配置
    enabled: true                   # 反馈检测总开关
    min_confidence: 0.6             # LLM 提取最低置信度

intent_routing:
  # L1 keyword hit-rate thresholds
  l1_threshold_default: 0.10
  l1_threshold_strict: 0.14
  # L2 Chroma semantic matching
  l2_similarity_threshold: 0.80
  l2_length_ratio_floor: 0.4
  l2_length_ratio_penalty: 0.7
  l2_topk: 1
  # L3 LLM classification confidence tiers
  l3_dag_min_confidence: 0.99       # 强制走 ReAct（几乎所有查询不满足 DAG 置信度）
  l3_react_min_confidence: 0.3
  # Feature flags
  l25_enabled: false
  generic_template_enabled: false   # 关闭通用 DAG 模板，让 Agent 自主选工具
  lookup_shortcut_enabled: false    # 关闭 lookup 快捷路径，不跳过 ReAct

logging:
  level: "INFO"
  format: "console"            # json | console（生产推荐 json 便于采集）
  include_trace_id: true
  business_stream: "stderr"    # 业务日志输出流；trace 日志走 observability.console_stream
