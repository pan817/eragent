# ERP Agent 系统配置文件
# 敏感信息（API Key 等）通过环境变量注入，不在此文件中存储

app:
  name: "ERP Analysis Agent"
  version: "0.1.0"
  debug: false
  language: "zh"  # 报告语言：zh=中文
  timezone: "Asia/Shanghai"  # 业务时区：全链路(代码/DB/checkpointer)统一使用；改动需重启进程

llm:
  provider: "qwen"          # 模型提供商：zhipu / openai / deepseek / qwen
  model: "qwen3-max"             # 默认模型
  # api_base: "https://open.bigmodel.cn/api/paas/v4"  # API Base URL
  api_base: "https://dashscope.aliyuncs.com/compatible-mode/v1"
  # api_key: 通过环境变量 LLM_API_KEY 注入
  temperature: 0.1
  max_tokens: 4096
  timeout: 240               # 请求超时（秒）；单次 LLM 最大耗时 240s
  max_retries: 2             # 最大重试次数；最坏 240s×3=720s
  use_system_proxy: false    # 是否读取系统代理（HTTP_PROXY/HTTPS_PROXY）；false=强制直连
  context_window: 32768      # 模型上下文窗口大小（token 数）
  token_estimate_ratio: 1.5  # 字符数 / token 数估算比率（中文约 1.5）

neo4j:
  enabled: false              # 总开关：false 时服务不依赖 Neo4j，相关功能短路
  uri: "bolt://localhost:7687"
  username: "neo4j"
  # password: 通过环境变量 NEO4J_PASSWORD 注入
  database: "neo4j"
  max_connection_pool_size: 10

chroma:
  persist_directory: "./data/chroma"
  collection_name: "erp_ontology"      # 兼容字段（旧版默认 collection）
  embedding_provider: "default"        # default | fake | openai | dashscope | zhipu
  embedding_model: "text-embedding-3-small"
  embedding_api_base: ""               # 远端 provider 的 API Base
  # embedding_api_key: 通过环境变量 CHROMA_EMBEDDING_API_KEY 注入
  default_top_k: 5
  min_score: 0.0
  enable_long_term_indexing: false   # 长期记忆写入时同步索引到向量库
  enable_report_indexing: false      # 报告写入时同步索引到向量库
  # 多 collection 划分：业务键 → 实际 collection 名称
  collections:
    ontology_p2p: "ontology_p2p"
    business_docs_p2p: "business_docs_p2p"
    analysis_reports: "analysis_reports"
    memory_long_term: "memory_long_term"

postgresql:
  host: "localhost"
  port: 5432
  database: "eragent"
  username: "dev"
  # password: 通过环境变量 POSTGRES_PASSWORD 注入
  pool_size: 20
  max_overflow: 30

mock_data:
  record_count: 500              # 模拟数据生成条数（PO/发票/付款各 N 条）
  seed: 42                       # 随机种子，确保数据可重复

analysis:
  default_time_range_days: 30    # 默认分析时间范围（天）
  max_time_range_days: 365       # 单次查询最大时间范围（天）
  response_timeout_seconds: 900.0  # 整体超时；需覆盖 LLM 含重试(720s) + 编排开销
  db_io_timeout_seconds: 30.0    # 数据库 I/O 单次操作硬超时（秒）

  # 实体编号正则模式（按客户 EBS 编号规则配置）
  # 每个实体支持多个正则模式（按顺序尝试，首个匹配即返回）
  entity_patterns:
    po_number:
      - 'PO-\d[\da-zA-Z_-]*\d'     # PO-2024-0001
      - 'PO-\d+'                     # PO-001
    supplier_id:
      - 'SUP-\d+'                    # SUP-001
    invoice_number:
      - 'INV-\d[\da-zA-Z_-]*\d'     # INV-2024-0001
      - 'INV-\d+'                    # INV-001
    payment_number:
      - 'PAY-\d[\da-zA-Z_-]*\d'     # PAY-2024-0001
      - 'PAY-\d+'                    # PAY-001
    receipt_number:
      - 'RCV-\d[\da-zA-Z_-]*\d'     # RCV-2024-0001
      - 'RCV-\d+'                    # RCV-001
    days:
      - '(?:最近|过去|近)\s*(\d+)\s*天'
      - '(?:past|last|recent)\s+(\d+)\s*days?'

agent_runtime:
  max_short_term_sessions: 1024       # 进程内最大并发 session 数（LRU 淘汰）
  retry_backoff_base_seconds: 1.0     # 重试退避基数（秒），实际等待 base * 2^attempt
  retry_backoff_max_seconds: 30.0     # 退避上限（秒）

observability:
  max_io_text: 2000                   # trace 中 input/output 文本截断长度
  max_error_text: 8192                # trace 中 error 字段（含异常链）最大字符数
  trace_queue_maxsize: 10000          # trace 异步写入队列上限
  trace_batch_size: 50                # 批量写入条数
  trace_flush_interval: 1.0           # 批量写入间隔（秒）

async_analysis:
  max_concurrent_tasks: 5             # 同进程并发分析任务上限，超出 queued 排队
  result_cache_ttl_sec: 600           # 任务完成后内存中 result 快照保留时间
  sweep_interval_sec: 60              # 清理过期 entry 的扫描周期
  event_buffer_size: 200              # 每 trace_id 的 SSE 事件环形缓冲条数
  sse_heartbeat_sec: 15               # SSE 心跳周期（秒），防代理 idle 超时

  # SSE 事件总线后端。
  # - memory：进程内 asyncio.Queue，仅适用于 workers=1 的单进程部署
  # - redis：Redis Pub/Sub + 环形缓冲，支持 uvicorn --workers>1 多进程共享事件
  # 多 worker 部署必须使用 redis，否则 POST 落到 worker A 的任务事件无法
  # 送达订阅落在 worker B 的 SSE 连接，前端只能看到心跳（详见 docs/issue/async_analyze_backend_issue.md）
  event_backend: "memory"
  redis_url: "redis://localhost:6379/0"  # 仅 event_backend=redis 时需要
  redis_key_prefix: "eragent:events"     # Redis key 前缀，多实例隔离用

p2p:
  three_way_match:
    default_tolerance_pct: 5.0   # 三路匹配默认容差（%）
    max_tolerance_pct: 10.0      # 最大容差上限（%）
    # 按供应商配置容差（示例）
    supplier_tolerances: {}
    # 按物料类别配置容差（示例）
    category_tolerances:
      RAW_MATERIAL: 10.0         # 大宗原材料放宽至10%
    # 按金额区间配置容差（示例）
    amount_thresholds:
      - min_amount: 1000000      # 金额超过100万收紧
        tolerance_pct: 2.0

  payment_compliance:
    early_payment_threshold_days: 5   # 提前超过N天预警
    overdue_severity:
      low_days: 7                     # 逾期<7天：LOW
      medium_days: 30                 # 逾期7-30天：MEDIUM
      high_days: 30                   # 逾期>30天：HIGH

  supplier_performance:
    benchmarks:
      otif_rate: 95.0                 # OTIF 基准值（%）
      invoice_accuracy_rate: 99.0     # 发票准确率基准值（%）
      quality_pass_rate: 98.0         # 质量合格率基准值（%）
      price_compliance_rate: 98.0     # 价格执行率基准值（%）

  anomaly_severity:
    high_amount_threshold: 500000     # 金额超过50万自动升为HIGH
    variance_high_multiplier: 2.0     # 超容差2倍以上为HIGH

memory:
  short_term:
    max_messages: 20            # 滑动窗口最大消息数
    summary_threshold: 15       # 超过N条消息触发摘要压缩
    context_trim_enabled: true  # 注入 LLM 前的 token 裁剪兜底开关
    context_max_tokens_pct: 15  # 短期记忆最大占 context_window 的百分比
  long_term:
    enabled: true               # 长期记忆主路径总开关（SQL 读写）
    max_retrieved: 5            # Hybrid 检索最多返回N条历史记忆
    context_trim_enabled: true  # 注入 LLM 前的 token 裁剪兜底开关
    context_max_tokens_pct: 10  # 长期记忆最大占 context_window 的百分比
    fusion_k: 60                # RRF 融合的平滑常数
    max_per_user: 200           # 每个用户保留的最大记忆条数（0 表示不限制）
    min_content_len: 50         # 短于该长度的内容直接 skip（0 关闭）
    dedupe_window_seconds: 900  # 同 user + 同 content_hash 的去重时间窗口（0 关闭）
    skip_empty_conclusions: false  # 跳过 anomaly_count=0 且 summary 空的结论
  react:
    trim_enabled: true              # ReAct 循环内 LLM 输入裁剪总开关
    keep_recent_rounds: 2           # 保留最近几轮完整对话（含工具结果）
    tool_content_max_chars: 500     # 早期 ToolMessage 截断字符数（0=清空内容）

logging:
  level: "INFO"
  format: "json"               # json | console
  include_trace_id: true
